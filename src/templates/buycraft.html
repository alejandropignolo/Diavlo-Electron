<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <link rel="icon" href="../images/logotipo.png" type="image/png">
    <title>Diavlo v3.6.1</title>
    <link href='https://fonts.googleapis.com/css?family=Manrope' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <!-- IMPORTAMOS LA LIBRERIA PARA HACER EL EFECTO DE LAS PARTICULAS  -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="../js/events.js"></script>
    <!-- ESTILOS PERSONALIZADOS -->
    <link rel="stylesheet" href="../../electron/css/buycraft.css">
    <link rel="stylesheet" href="../../electron/css/responsive_index.css">
    <link rel="stylesheet" href="../../electron/css/styles.css">
    <link rel="stylesheet" href="../../electron/css/header.css">
    <link rel="stylesheet" href="../../electron/css/responsive.css">

    <!-- IMPORTAMOS Funcionalidad de JS -->
    <script src="../js/buycraft.js"></script>
    <style>
        @media (max-height: 710px) {
            .tebex-coupons-list {
                max-height: 92px;
            }
        }

        #container__buycraft {
            margin-left: -20px;
        }
    </style>

</head>

<body>
    <!-- Efecto de particulas -->
    <div id="particles-container"></div>

    <audio id="backgroundAudio" autoplay>
        <source src="../song/click.mp3" type="audio/mp3">
    </audio>

    <main>

        <header class="loggedHeader">
            <div class="headerUserData">
                <div class="rankImage">
                    <img src="../images/logotipo.png" draggable="false" alt="logo">
                </div>
                <div class="user-info">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <h2 class="usernameHeader">frozencode</h2>
                    </div>

                    <div class="rank-data">
                        <div class="data__diavlo">
                            <h3>Loading...</h3>
                            <span>Loading...</span>
                        </div>
                        <div class="data__gen">
                            <h3></h3>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="headerOptions">
                <img class="HeaderHome" src="../images/home.webp" height="20px" width="20px">
                <img class="HeaderHome" id="logout" src="../images/logout.png" height="20px" width="20px">
            </div>
        </header>

        <section id="container__buycraft">

            <div class="secret-key-div">

                <div class="backdiv">
                    <img src="../images/back.png" height="25px" width="25px" class="gobacktools">
                </div>

                <div class="searchBar">
                    <form id="form_mc" action="return false;">
                        <input type="password" placeholder="Introduce la Secret Key"  name="search" minlength="20"
                            maxlength="70" id="busqueda" required>
                        <button type="button" id="searchButton">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-search" viewBox="0 0 16 16">
                                <path
                                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                            </svg>
                        </button>
                    </form>
                </div>
                
            </div>

            <div class="TebexData" style="display: none;">

                <div class="header-tebex-info">
                    <div class="backdiv">
                        <img src="../images/back.png" height="25px" width="25px" class="gobacktools2">
                    </div>

                    <div class="header-tebex-img">
                        <img height="100px" width="100px">
                    </div>

                    <div class="header-tebex-data">
                        <h2 class="header-tebex-data-title"></h2>
                        <a class="header-tebex-data-url"></a>
                        <div class="tebex-options">
                            <button class="tebex-orders-button" id="orders-button">Compras</button>
                            <button class="tebex-orders-button" id="cupons-button">Cupones</button>
                            <button class="tebex-orders-button" id="packages-button">Paquetes</button>
                        </div>
                    </div>

                </div>

                <div class="tebex-data">
                    
                    <div class="tebex-orders">
                        <h3 class="tebex-data-subtitle">Últimas 100 compras:</h3>
                        <ul class="tebex-order-list">

                        </ul>
                        <h3 class="tebex-data-total-paid"></h3>


                    </div>

                    <div class="tebex-coupons" style="display: none;">
                        <div class="divCouponCreate">
                            <p>Crear cupón de 100% de descuento</p>
                            <div class="divFormCouponCreate">
                                <form>
                                    <input minlength="3" required type="text" id="coupon" class="cuponCreateInput" placeholder="Introduce un código para el cupón"/>
                                    <button type="submit" class="botonCrearCupon">Crear</button>
                                </form>
                            </div>

                        </div>
                        <h2 class="tebex-data-subtitle">Cupones:</h2>
                        <ul class="tebex-coupons-list">

                        </ul>
                    </div>

                    <div class="tebex-packages" style="display: none;">
                        <div class="edit-package-div" style="display: none;">
                            <span class="close-edit-package">X</span>
                            <form>
                                <div style="display: flex; text-align: center; gap: 10px;">
                                    <h4>Editando el paquete con id: <h4 class="package-edit-id"></h4></h4>
                                </div>
                                <input type="text" minlength="1" required class="edit-package-title" placeholder="Nombre del paquete" required>
                                <input type="number" min="0" required class="edit-package-price" placeholder="Precio del paquete" required>
                                <button type="button" class="edit-package-save botonCrearCupon">Editar</button>
                            </form>

                        </div>

                        <h2 class="tebex-data-subtitle">Paquetes:</h2>

                        <ul class="tebex-packages-list">

                        </ul>
                    </div>

                </div>


            </div>

        </section>

    </main>

    <footer>
        <ul>
            <li><span>Diavlo v3.6 © 2025</span></li>
            <li><a href="https://diavlo.store">Tienda</a></li>
            <li><a href="https://discord.gg/programadores">Discord</a></li>
            <li><a href="https://t.me/diavlochannel">Telegram</a></li>
        </ul>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js" integrity="sha384-Rx+T1VzGupg4BHQYs2gCW9It+akI2MM/mndMCy36UVfodzcJcF0GGLxZIzObiEfa" crossorigin="anonymous"></script>
</body>
</html>
