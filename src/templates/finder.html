<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <link rel="icon" href="../images/logotipo.png" type="image/png">
    <title>Diavlo v3.6 - Finder</title>
    <link href='https://fonts.googleapis.com/css?family=Manrope' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <!-- IMPORTAMOS LA LIBRERIA PARA HACER EL EFECTO DE LAS PARTICULAS  -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="../js/events.js"></script>
    <script src="../js/finder.js"></script>
    <!-- ESTILOS PERSONALIZADOS -->
    <link rel="stylesheet" href="../../electron/css/index.css">
    <link rel="stylesheet" href="../../electron/css/responsive_index.css">
    <link rel="stylesheet" href="../../electron/css/finder.css">
    <link rel="stylesheet" href="../../electron/css/styles.css">
    <link rel="stylesheet" href="../../electron/css/finder_responsive.css">
    <link rel="stylesheet" href="../../electron/css/header.css">
    <link rel="stylesheet" href="../../electron/css/responsive.css">
    <style>
        section {
            bottom: 17px !important;
        }
    </style>
</head>

<body>
    <!-- Efecto de particulas -->
    <div id="particles-container"></div>

    <audio id="backgroundAudio" autoplay>
        <source src="../song/click.mp3" type="audio/mp3">
    </audio>

    <main>

        <header class="loggedHeader">
            <div class="headerUserData">
                <div class="rankImage">
                    <img src="../images/logotipo.png" draggable="false" alt="logo">
                </div>
                <div class="user-info">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <h2 class="usernameHeader">Loading...</h2>
                    </div>

                    <div class="rank-data">
                        <div class="data__diavlo">
                            <h3>Loading...</h3>
                            <span>Loading...</span>
                        </div>
                        <div class="data__gen">
                            <h3></h3>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="headerOptions">
                <img class="HeaderHome" src="../images/home.webp" height="20px" width="20px">
                <img class="HeaderHome" id="logout" src="../images/logout.png" height="20px" width="20px">

            </div>
        </header>

        <section>

            <div id="container_logo_finder">
                <img id="logo_finder" src="../images/logotipo.png"/>
                <h4>
                    Descubre información relacionada a estas diferentes opciones:
                </h4>
            </div>


            <div class="searchTypes">
                <div id="usernameTypeBtn">
                    <input type="radio" name="searchType" value="username" checked/>
                    <label class="searchTypeChecked">Username</label>
                </div>
                <div id="emailTypeBtn" >
                    <input type="radio" name="searchType" value="email"/>
                    <label>Email</label>
                </div>     
                <div id="realNameTypeBtn" class="extended">
                    <input type="radio" name="searchType" value="realname"/>
                    <label>Nombre Completo</label>
                </div>             
                <div id="passwordTypeBtn" class="extended">
                    <input type="radio" name="searchType" value="password"/>
                    <label>Contraseña</label>
                </div>  
                <div id="domainTypeBtn" class="extended">
                    <input type="radio" name="searchType" value="domain"/>
                    <label>Dominio</label>
                </div>  
                <div id="ipTypeBtn" class="extended">
                    <input type="radio" name="searchType" value="ipaddress"/>
                    <label>IP</label>
                </div>  
                <div id="phoneTypeBtn" class="extended">
                    <input type="radio" name="searchType" value="phone"/>
                    <label>Teléfono</label>
                </div>  
            </div>

            <form class="searchBar" id="finder_button">
                <input type="text" placeholder="Introduce un nombre de usuario" name="search" minlength="4" maxlength="45" required>
                <button type="submit" id="searchButton"><i class="bi bi-search"></i></button>
                <div class="export">
                    <img class="export-img" src="../images/download.png" height="25px" width="25px" class="exportBtnMC">
                </div>
            </form>
            <div class="loader">
                <div class="orbit-spinner">
                    <div class="orbit"></div>
                    <div class="orbit"></div>
                    <div class="orbit"></div>
                </div>
                <span class="loadingText">Cargando...</span>
            </div>
            <div id="resultText">
                <br>
            </div>

            <div class="results">
                <div id="pswFilter" class="passwordFilter">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-envelope-at-fill" viewBox="0 0 16 16">
                        <path d="M2 2A2 2 0 0 0 .05 3.555L8 8.414l7.95-4.859A2 2 0 0 0 14 2H2Zm-2 9.8V4.698l5.803 3.546L0 11.801Zm6.761-2.97-6.57 4.026A2 2 0 0 0 2 14h6.256A4.493 4.493 0 0 1 8 12.5a4.49 4.49 0 0 1 1.606-3.446l-.367-.225L8 9.586l-1.239-.757ZM16 9.671V4.697l-5.803 3.546.338.208A4.482 4.482 0 0 1 12.5 8c1.414 0 2.675.652 3.5 1.671Z"/>
                        <path d="M15.834 12.244c0 1.168-.577 2.025-1.587 2.025-.503 0-1.002-.228-1.12-.648h-.043c-.118.416-.543.643-1.015.643-.77 0-1.259-.542-1.259-1.434v-.529c0-.844.481-1.4 1.26-1.4.585 0 .87.333.953.63h.03v-.568h.905v2.19c0 .272.18.42.411.42.315 0 .639-.415.639-1.39v-.118c0-1.277-.95-2.326-2.484-2.326h-.04c-1.582 0-2.64 1.067-2.64 2.724v.157c0 1.867 1.237 2.654 2.57 2.654h.045c.507 0 .935-.07 1.18-.18v.731c-.219.1-.643.175-1.237.175h-.044C10.438 16 9 14.82 9 12.646v-.214C9 10.36 10.421 9 12.485 9h.035c2.12 0 3.314 1.43 3.314 3.034v.21Zm-4.04.21v.227c0 .586.227.8.581.8.31 0 .564-.17.564-.743v-.367c0-.516-.275-.708-.572-.708-.346 0-.573.245-.573.791Z"/>
                      </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-person-vcard-fill" viewBox="0 0 16 16">
                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm9 1.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 0-1h-4a.5.5 0 0 0-.5.5ZM9 8a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 0-1h-4A.5.5 0 0 0 9 8Zm1 2.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 0-1h-3a.5.5 0 0 0-.5.5Zm-1 2C9 10.567 7.21 9 5 9c-2.086 0-3.8 1.398-3.984 3.181A1 1 0 0 0 2 13h6.96c.026-.163.04-.33.04-.5ZM7 6a2 2 0 1 0-4 0 2 2 0 0 0 4 0Z"/>
                    </svg>
                </div>

                <ul class="listaResultados">

                </ul>

            </div>
        </section>

    </main>

    <footer>
        <ul>
            <li><span>Diavlo v3.6 © 2025</span></li>
            <li><a href="https://diavlo.store">Tienda</a></li>
            <li><a href="https://discord.gg/programadores">Discord</a></li>
            <li><a href="https://t.me/diavlochannel">Telegram</a></li>
        </ul>

    </footer>
</body>

</html>
