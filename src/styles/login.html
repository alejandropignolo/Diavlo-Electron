<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <link rel="icon" href="../images/logotipo-mascota-diablo_94073-65-removebg-preview.png" type="image/png">
    <title>Diavlo | Log-in</title>
    <link href='https://fonts.googleapis.com/css?family=Manrope' rel='stylesheet'>
    <link rel="stylesheet" href="../../electron/css/login.css">
    <link rel="stylesheet" href="../../electron/css/responsive_login.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <!-- IMPORTAMOS LA LIBRERIA PARA HACER EL EFECTO DE LAS PARTICULAS  -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="../js/events.js"></script>
    <script src="../js/login.js"></script>
</head>
<body>
    <!-- Efecto de particulas -->
    <div id="particles-container"></div>

    <main>
        <div class="login-card">
            <img src="../images/logotipo-mascota-diablo_94073-65-removebg-preview.png"></img>
            <form action="/login" method="post" class="login-form">
                <div id="error" class="hidden">
                    <span id="error-login" >¡Usuario o contraseña incorrectos!</span>
                </div>
                <p>Inicia sesión:</p>
                <input type="text" name="username" id="username" placeholder="Usuario de Diavlo" required>
                <input type="password" name="password" id="password" placeholder="Contraseña de Diavlo" required>
                <input type="submit" class="sign-in-button" value="Iniciar Sesión"/>

                <div class="login-no-account">
                    <a href="https://shoppy.gg/@diavlomc">Comprar una tarifa</a>
                </div>
                

            </form>

        </div>

    </main>

    <footer>
        <ul>
            <li><span>Diavlo v3 © 2023</span></li>
            <li><a href="https://shoppy.gg/@diavlomc">Tienda</a></li>
            <li><a href="https://discord.gg/programadores">Discord</a></li>
            <li><a href="https://t.me/diavlodb">Telegram</a></li>
        </ul>
        
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</body>
</html>
